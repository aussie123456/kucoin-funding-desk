name: Refresh dashboard

on:
  schedule:
    - cron: "17 * * * *"    # hourly, every day (crypto trades around the clock)
  workflow_dispatch:        # the "Run workflow" button = manual refresh
  push:
    branches: [main]
    paths: [template.html, build.pl, desk.json, data/seed.json, .github/workflows/refresh.yml]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Fetch previously published data (fallback if a venue refuses the runner)
        run: |
          curl -sSL --fail --max-time 60 -o previous.json "${{ steps.pages.outputs.base_url }}/data.json" || rm -f previous.json
          ls -l previous.json 2>/dev/null || echo "no previous data (first run)"

      - name: Build page
        env:
          REFRESH_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/refresh.yml
        run: perl build.pl --previous previous.json --out dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
